name: Weekly Lead Digest Emails

on:
  schedule:
    # Runs at 08:00 AM UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows you to run it manually from GitHub

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger HavenFinder Email Cron
        run: |
          curl -X POST https://havenfinderapi-production.up.railway.app/admin/test-emails \
          -H "Content-Type: application/json"
